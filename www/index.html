<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>将棋AI</title>
<link rel="stylesheet" href="./style.css">
<link rel="preload" href="./pkg/shogi_engine_bg.wasm" as="fetch" type="application/wasm">
<link rel="modulepreload" href="./engine.js">
<link rel="modulepreload" href="./app.js">
</head>
<body>
<div id="app">
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">エンジンを読み込み中…</div>
  </div>
  <h2>将棋AI — ブラウザ完全ローカル動作</h2>
  <div id="status">読み込み中…</div>
  <div id="controls">
    <label>AIの強さ:</label>
    <select id="depth">
      <option value="d1">1手読み（最速）</option>
      <option value="d3" selected>3手読み（標準）</option>
      <option value="t1000">強い（1秒）</option>
      <option value="t3000">最強（3秒）</option>
    </select>
    <label>あなたは:</label>
    <select id="side">
      <option value="0">先手</option>
      <option value="1">後手</option>
    </select>
    <button id="restart-btn" disabled>最初から</button>
  </div>
  <div id="thinking"></div>
  <div id="engine-info">
    <div id="eval-line"></div>
    <div id="pv-line"></div>
  </div>
  <div id="game-area">
    <div class="hand-area" id="hand-gote-area">
      <div class="hand-label">後手の持ち駒</div>
      <div class="hand-pieces" id="hand-gote"></div>
    </div>
    <div id="board-area">
      <div class="coord-row" id="coord-top"></div>
      <div style="display:flex">
        <div id="board-wrap">
          <table id="board"></table>
          <div id="promo-dialog" hidden>
            <div class="promo-label">成りますか？</div>
            <button id="promo-yes">成る</button>
            <button id="promo-no">成らず</button>
          </div>
        </div>
        <div class="coord-col" id="coord-side"></div>
      </div>
    </div>
    <div class="hand-area" id="hand-sente-area">
      <div class="hand-label">先手の持ち駒</div>
      <div class="hand-pieces" id="hand-sente"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
