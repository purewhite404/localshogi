[package]
name = "shogi_wasm"
version = "0.1.0"
edition = "2021"
description = "Rust and WebAssembly shogi engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
